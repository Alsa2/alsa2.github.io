<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alek Salvetti</title>
<style>
  body {
    margin: 0;
    background: #fdfdf8;
    color: #111;
    font-family: "Times New Roman", Times, serif;
    font-size: 17px;
    line-height: 1.4;
  }
  .page { max-width: 860px; margin: 0 auto; padding: 36px 20px 48px; }
  h1 { font-size: 30px; font-weight: normal; margin: 0 0 4px; }
  .sub { margin: 0; }
  hr { border: 0; border-top: 1px solid #999; margin: 20px 0; }
  a { color: #0000ee; }
  a:visited { color: #551a8b; }

  /* Hello there, nothing to see here */

  /* cards */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }
  .card {
    position: relative;
    aspect-ratio: 4 / 3;
    border: 1px solid #222;
    background: #eeeee6;
    overflow: hidden;
    outline: none;
  }
  .card > img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; text-align: center;
    font-family: "Courier New", Courier, monospace; font-size: 15px;
  }
  .card .info {
    position: absolute; inset: 0;
    background: rgba(253, 253, 248, 0.96);
    padding: 14px 16px;
    display: flex; flex-direction: column;
    opacity: 0; visibility: hidden;
    transition: opacity 0.15s;
  }
  .card .info b { font-size: 18px; margin-bottom: 6px; }
  .card .info .ptitle { font-size: 14px; margin: -4px 0 6px; }
  .card .info span { font-size: 15px; flex: 1; overflow: auto; }
  .card:hover .info, .card:focus-within .info, .card.open .info { opacity: 1; visibility: visible; }

  button.more-btn {
    align-self: flex-start;
    margin-top: 8px;
    font-family: "Courier New", Courier, monospace; font-size: 13px;
    background: none; border: 1px solid #222; padding: 2px 8px;
    cursor: pointer; color: #111;
  }
  button.more-btn:hover { background: #111; color: #fdfdf8; }

  /* details box */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .box {
    background: #fdfdf8;
    border: 1px solid #222;
    width: 90vw; max-width: 1150px;
    height: 85vh;
    display: flex; flex-direction: column;
  }
  .box-head {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 20px; border-bottom: 1px solid #999;
  }
  .box-head h2 { font-size: 24px; font-weight: normal; margin: 0; }
  .close {
    font-family: "Courier New", Courier, monospace; font-size: 14px;
    background: none; border: 0; color: #0000ee; text-decoration: underline;
    cursor: pointer; padding: 0;
  }
  .box-body { flex: 1; display: flex; min-height: 0; }
  .photos {
    width: 42%; overflow: auto;
    padding: 16px 20px; border-right: 1px solid #ccc;
  }
  .photos figure { margin: 0 0 20px; }
  .photos img { width: 100%; display: block; border: 1px solid #222; }
  .photos figcaption { font-size: 14px; margin-top: 4px; }
  .photos figcaption b { display: block; font-size: 15px; }
  .text { flex: 1; overflow: auto; padding: 16px 24px; }
  .text p { margin: 0 0 14px; }
  .box.nophotos .photos { display: none; }

  @media (max-width: 700px) {
    .box { width: 96vw; height: 92vh; }
    .box-body { flex-direction: column; overflow: auto; }
    .photos, .text { width: auto; overflow: visible; border: 0; }
  }

  .more { text-align: center; margin-top: 28px; }
  .more p { margin: 4px 0; }
  .small { font-size: 13px; color: #666; }
</style>
</head>
<body>
<div class="page">

  <h1>Alek Salvetti</h1>
  <p class="sub">Aerospace Engineering, Virginia Tech</p>
  <p class="sub">Hardware, FPGAs, GNSS, and small spacecrafts.</p>

  <hr>

  <div class="grid" id="grid"></div>

  <hr>

  <div class="more">
    <p><i>More to come...</i></p>
    <p><a href="mailto:aleks@vt.edu">aleks@vt.edu</a></p>
    <p class="small">Last updated November 2026</p>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="box" id="box" role="dialog" aria-modal="true" aria-labelledby="box-title">
    <div class="box-head">
      <h2 id="box-title"></h2>
      <button class="close" id="close">[close]</button>
    </div>
    <div class="box-body">
      <div class="photos" id="box-photos"></div>
      <div class="text" id="box-text"></div>
    </div>
  </div>
</div>

<script>
  // Each project: card title, short hover text, photos (first one is the card face), long text paragraphs.
  var projects = [
    {
      title: "Phased-array GPS receiver",
      short: "Four-element L1 GPS receiver with a custom RF front end and an FPGA pipeline for acquisition and tracking. Research with Prof. Mark Psiaki.",
      photos: [
        { src: "img/gps-receiver.jpg", title: "Back of the receiver board",
          cap: "RF board (left) plugged into the Zybo FPGA board. The bundle of traces carries the 2-bit IQ outputs of the four channels." },
        { src: "img/old-patch-antennas.jpg", title: "First antennas, etched in the PCB",
          cap: "They ended up large, with a 10 dB axial ratio instead of the 3 dB required." },
        { src: "img/new-ceramic-patches.jpg", title: "Ceramic patch antennas",
          cap: "Four ceramic patches soldered on the top side replaced the PCB patches." }
      ],
      long: [
        "The goal of this project is a four-element phased-array GPS receiver, with the whole signal chain running on an FPGA. A phased array increases the signal-to-noise ratio, and by beamforming each satellite channel towards the actual satellite heading it can also remove jammers and spoofers. On the FPGA this beamforming is almost free resource wise, and it can be parallelized for each channel.",
        "I designed the RF board around four MAX2769B chips, which contain the LNA, mixers and ADCs, and added a SAW filter between the LNA and the mixer to remove WiFi and cellular noise. The board uses a stackup with 50 Ω traces. I first tried to integrate the patch antennas directly onto the PCB, but due to the thin dielectric they ended up huge, with an axial ratio of 10 dB rather than the 3 dB required for a circularly polarized antenna, so I switched to four ceramic patches. A single 16.368 MHz clock goes through a 1-to-4 buffer to all four MAX2769B, with matched trace lengths so all the channels sample at the same time, hopefully removing the need to calibrate the array. The gains of the four chips are set over SPI, since all four elements need matching gains for the beamforming to work.",
        "The algorithms from class could not be copied onto the FPGA, they had to be designed almost from scratch. In MATLAB, removing the Doppler was just a multiplication with a complex exponential, while on the FPGA I had to design a numerically controlled oscillator driven by the tracking loops. Every variable also had to be sized to fit the DSP slices, so I used testbenches on real data to find the best compromise between precision and overflow.",
        "The front end samples 2-bit IQ at 16.368 MHz, while the processing is pipelined to run at 100 MHz. Acquisition and tracking are modules that can be instantiated as needed, with each tracking loop using about 1500 of the 17600 LUTs on the Zynq-7000, so up to 11 trackers fit on this chip. The Doppler range can also be widened past the usual 10 kHz for spacecraft trajectories. We tested the receiver with a HackRF and then with a Spirent GSS9000 simulator, measuring a C/N0 of 49.4 dB-Hz.",
        "So far acquisition, tracking and the pseudorange and ephemeris extraction work. I'm currently working on the position solution and on per-channel beamforming, so each tracker only listens to its own satellite."
      ]
    },
    {
      title: "ContentCube (1U CubeSat)",
      short: "InspireFly's 1U CubeSat, deployed from the ISS in December 2025. I took over the PCB work and did the final assembly.",
      photos: [
        { src: "img/assembled-cubesat.jpg", title: "Assembled flight model",
          cap: "ContentCube after final assembly, with the remove-before-flight tag." },
        { src: "img/cubesat-selfie.jpg", title: "Selfie from the ContentCube camera",
          cap: "Taken by the payload camera during ground testing." }
      ],
      long: [
        "I took over the PCB work on this satellite: the payload board, fixes on the battery, solar and flight controller boards, and the assembly of all the boards including the flight models. I also helped the programming team with low-level code, such as the watchdog interface and the SPI link to the antenna deployment, and I did the final assembly of the satellite in the cleanroom.",
        "The first version of the payload board used an external daughterboard for the display, which required a large cutout in the center of the board and drew a lot of power. After going through the schematic I found that many components were not needed for our application, such as logic level converters and an inefficient LDO. I moved the remaining components onto the payload board and connected the display directly, reducing the component count and the power draw.",
        "The satellite didn't work in orbit. Most of the board development happened the year before launch, so the programming team only got the finalized hardware weeks before the deadline, and optional features such as remote firmware updates were dropped. In the rush, the transmit power was left at the reduced testing level, causing our signals to be attenuated in the atmosphere, and without firmware updates there was no way to fix it.",
        "Another important lesson is that external designs are not always fully tested. After the Voyager Space vibration testing, every component remained intact except a single screw on the commercial antenna, which we had avoided handling because we only had one set. The launch went ahead only because our launch provider asked NASA for an exception."
      ]
    },
    {
      title: "Lasercom prototype",
      short: "Laser communication prototype for InspireFly, with live decoding and error correction on an FPGA.",
      photos: [
        { src: "img/lasercom-schematic.jpg", title: "Lasercom schematic",
          cap: "TX chain, RX chain and the FPGA bus." }
      ],
      long: [
        "The goal of this prototype is a laser link where the FPGA decodes the data live. The receive chain consists of a photodiode, a TIA and a comparator feeding the FPGA. Tuning the TIA is the hard part: small changes in the capacitance at the photodiode input require completely re-adjusting the feedback resistor to avoid side effects such as ringing.",
        "Decoding on the FPGA allows live forward error correction, so burst errors are fixed on the fly and unfixable blocks can be requested again immediately. On the other hand, a receiver that saves the data and processes it afterwards may not be able to ask for the retransmission in time. The decoding chain can also be duplicated for redundancy, and the predictable latency of the FPGA allows ranging on the same link.",
        "I'm now implementing a time-to-digital converter in the FPGA carry chain, so the ranging doesn't rely on an external TDC chip."
      ]
    },
    {
      title: "CubeSat patch antenna",
      short: "UHF patch antenna board for InspireFly's pocket cubes, designed in Ansys and optimized with MATLAB on VT ARC.",
      photos: [
        { src: "img/old-patch-antennas.jpg", title: "Reference: GPS receiver patches",
          cap: "The PCB patches on my GPS receiver were based on this circularly polarized InspireFly design." }
      ],
      long: [
        "Patch antennas remove the mechanical risks of a deployable antenna, such as making sure it deploys fully, while keeping a circular polarization that avoids multipath. They also have no height, so they fit on an external face of the satellite. Our new UHF board costs around 100 times less than the commercial antenna we flew on ContentCube, and one side of the PCB can carry the patch while the other carries the RF front end.",
        "I designed and simulated the polarized patches in Ansys Electronics Desktop and used the MATLAB Optimization Toolbox on the VT ARC supercomputers to optimize gain, axial ratio and S11.",
        "I now advise newer members on the RF side of the team. Rather than telling them exactly what to do, I show them the options (single or dual feed, and what each one requires) and the tools that worked for me, so they don't hit the same dead ends I did. Some of them ended up outperforming my design."
      ]
    },
    {
      title: "DARPA LIFT engine control",
      short: "CAN engine-control board and throttle controls for a gas-powered heavy-lift hexacopter. With Prof. Kevin Kochersberger.",
      photos: [
        { src: "img/darpa-hexacopter.jpg", title: "The hexacopter",
          cap: "The gas-powered heavy-lift hexacopter on the ground before a test." },
        { src: "img/motor-controller.jpg", title: "Engine-control board",
          cap: "Installed on the frame, with the actuator and sensor connectors." },
        { src: "img/engine-board-layout.jpg", title: "Board layout",
          cap: "PCB layout of the engine-control board." },
        { src: "img/darpa-calibration-stand.jpg", title: "Engine test stand",
          cap: "Used to map RPM against throttle input and to evaluate the step response." }
      ],
      long: [
        "The goal of the DARPA LIFT competition was to maximize the payload to vehicle mass ratio. Hence we chose gasoline engines, since gasoline plus a combustion engine has a much higher energy density than batteries and electric motors. The issue with this approach is that each engine responds differently to the throttle.",
        "We could either add the engine controls to the flight controller or build a separate system. I chose a separate CAN board close to the engines, which powers and reads the actuators and the hall effect RPM sensor locally, with only a power line and a CAN line going back to the avionics. This approach avoided long cable runs and allowed us to change the engine behavior without modifying the flight controller firmware, since the flight controller only sees a CAN engine.",
        "Straight PID made the already slow engine response even slower. So we added a feedforward term that sets the throttle opening directly for the requested RPM, plus state feedback with integration to correct for disturbances such as ambient temperature. We mapped RPM against throttle input on a test stand to build the feedforward curve, and used the same stand to evaluate the step response.",
        "The engines matched the requested RPM within 5 %, the cable mass dropped by more than half, and the drone passed the maximum mass requirement."
      ]
    },
    {
      title: "AmpLab soldering training",
      short: "Soldering trainer at AmpLab, with over 100 students trained so far.",
      photos: [
        { src: "img/soldering-board.jpg", title: "Basic Do Nothing Board",
          cap: "The board I designed for the basic soldering session." }
      ],
      long: [
        "I teach soldering at AmpLab, and over 100 students have gone through the training so far."
      ]
    },
    {
      title: "Sailing",
      short: "Me sailing.",
      photos: [
        { src: "img/sailing.jpg", title: "Me sailing", cap: "" }
      ],
      long: [
        "I like sailing."
      ]
    }
  ];

  var grid = document.getElementById("grid");
  var overlay = document.getElementById("overlay");
  var box = document.getElementById("box");

  function openDetails(p) {
    document.getElementById("box-title").textContent = p.title;
    var ph = document.getElementById("box-photos");
    ph.innerHTML = p.photos.map(function (f) {
      return '<figure><img src="' + f.src + '" alt="' + f.title + '">' +
             '<figcaption><b>' + f.title + '</b>' + f.cap + '</figcaption></figure>';
    }).join("");
    box.classList.toggle("nophotos", p.photos.length === 0);
    document.getElementById("box-text").innerHTML =
      p.long.map(function (t) { return "<p>" + t + "</p>"; }).join("");
    ph.scrollTop = 0; document.getElementById("box-text").scrollTop = 0;
    overlay.classList.add("show");
    document.body.style.overflow = "hidden";
    document.getElementById("close").focus();
  }
  function closeDetails() {
    overlay.classList.remove("show");
    document.body.style.overflow = "";
  }

  function addCard(p, f) {
    var card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;
    var face = f
      ? '<img src="' + f.src + '" alt="' + f.title + '" loading="lazy">'
      : '<div class="label">' + p.title + '</div>';
    var sub = (f && f.title !== p.title) ? '<i class="ptitle">' + f.title + '</i>' : '';
    card.innerHTML = face +
      '<div class="info"><b>' + p.title + '</b>' + sub + '<span>' + p.short + '</span>' +
      '<button class="more-btn">More details</button></div>';
    card.addEventListener("click", function () { card.classList.toggle("open"); });
    card.querySelector(".more-btn").addEventListener("click", function (e) {
      e.stopPropagation();
      openDetails(p);
    });
    grid.appendChild(card);
  }

  // one card per photo, all pointing to the same project details
  projects.forEach(function (p) {
    if (p.photos.length) p.photos.forEach(function (f) { addCard(p, f); });
    else addCard(p, null);
  });

  document.getElementById("close").addEventListener("click", closeDetails);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeDetails(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDetails(); });
</script>
<script data-goatcounter="https://alek.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  <meta name="google-site-verification" content="y5InBw0TmeUk_YHgXry48fmRN86Egv1LwaR5L5XwTtg" />
</body>
</html>
